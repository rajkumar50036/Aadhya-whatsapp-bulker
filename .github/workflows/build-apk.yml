name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: android-actions/setup-android@v3
    - name: Build APK
      run: |
        cd android
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew
        ./gradlew assembleDebug
        cp app/build/outputs/apk/debug/app-debug.apk ../Aadhya_WhatsApp_Bulker.apk
    - uses: actions/upload-artifact@v4
      with:
        name: Aadhya_WhatsApp_Bulker_APK
        path: Aadhya_WhatsApp_Bulker.apk
